<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Approval AI System</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- GOLD PARTICLES -->
    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">

        <h1>🏦 Loan Approval Prediction</h1>

        <form action="/predict" method="POST">

            <input type="number" step="any" name="ApplicantIncome" placeholder="Applicant Income" required>

            <input type="number" step="any" name="CoapplicantIncome" placeholder="Coapplicant Income" required>

            <input type="number" step="any" name="LoanAmount" placeholder="Loan Amount" required>

            <input type="number" step="any" name="Loan_Amount_Term" placeholder="Loan Amount Term" required>

            <!-- CREDIT HISTORY -->
            <select name="Credit_History" required>
                <option value="">Select Credit History</option>
                <option value="1">Good Credit History</option>
                <option value="0">Bad Credit History</option>
            </select>

            <!-- GENDER -->
            <select name="Gender_Male" required>
                <option value="">Select Gender</option>
                <option value="1">Male</option>
                <option value="0">Female</option>
            </select>

            <!-- MARRIED -->
            <select name="Married_Yes" required>
                <option value="">Marital Status</option>
                <option value="1">Married</option>
                <option value="0">Not Married</option>
            </select>

            <!-- DEPENDENTS -->
            <select name="Dependents_1" required>
                <option value="">Has 1 Dependent?</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <select name="Dependents_2" required>
                <option value="">Has 2 Dependents?</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <select name="Dependents_3+" required>
                <option value="">Has 3+ Dependents?</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <!-- EDUCATION -->
            <select name="Education_Not Graduate" required>
                <option value="">Education</option>
                <option value="0">Graduate</option>
                <option value="1">Not Graduate</option>
            </select>

            <!-- SELF EMPLOYED -->
            <select name="Self_Employed_Yes" required>
                <option value="">Self Employed?</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <!-- PROPERTY AREA -->
            <select name="Property_Area_Semiurban" required>
                <option value="">Semiurban Property?</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <select name="Property_Area_Urban" required>
                <option value="">Urban Property?</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <button type="submit">Predict Loan Status</button>

        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>

</body>

</html>
