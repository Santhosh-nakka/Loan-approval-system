<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Loan Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- PARTICLES -->

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="dashboard">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <h2>🏦 AI Loan</h2>

            <!-- DARK MODE BUTTON -->

            <button id="themeToggle" class="theme-btn">
                🌙 Dark Mode
            </button>

            <ul>

                <li>
                    <a href="/history">
                        <i class="fa-solid fa-clock-rotate-left"></i> History
                    </a>
                </li>

                <li>
                    <a href="/dashboard">
                        <i class="fa-solid fa-chart-line"></i> Dashboard
                    </a>
                </li>

                <!-- ACTIVE PREDICTION -->

                <li class="active">
                    <a href="/predict-page">
                        <i class="fa-solid fa-sack-dollar"></i> Prediction
                    </a>
                </li>

                <li>
                    <a href="/analytics">
                        <i class="fa-solid fa-chart-pie"></i> Analytics
                    </a>
                </li>

                <li>
                    <a href="/model-info">
                        <i class="fa-solid fa-robot"></i> AI Model
                    </a>
                </li>

            </ul>

        </div>

        <!-- MAIN CONTENT -->

        <div class="main-content prediction-page">

            <!-- FORM SECTION -->

            <div class="container">

                <h1>🏦 Loan Prediction</h1>

                <!-- RESULT AT TOP -->

                {% if prediction_text %}

                <div class="result-box">

                    <img
                        src="{{ url_for('static', filename='images/' + result_image) }}"
                        class="result-image"
                    >

                    <div class="result">

                        {{ prediction_text }}

                    </div>

                </div>

                {% endif %}

                <form action="/predict" method="POST">

                    <input type="number" step="any" name="ApplicantIncome" placeholder="Applicant Income" required>

                    <input type="number" step="any" name="CoapplicantIncome" placeholder="Coapplicant Income" required>

                    <input type="number" step="any" name="LoanAmount" placeholder="Loan Amount" required>

                    <input type="number" step="any" name="Loan_Amount_Term" placeholder="Loan Amount Term" required>

                    <select name="Credit_History" required>

                        <option value="">Select Credit History</option>

                        <option value="1">Good Credit History</option>

                        <option value="0">Bad Credit History</option>

                    </select>

                    <select name="Gender_Male" required>

                        <option value="">Select Gender</option>

                        <option value="1">Male</option>

                        <option value="0">Female</option>

                    </select>

                    <select name="Married_Yes" required>

                        <option value="">Marital Status</option>

                        <option value="1">Married</option>

                        <option value="0">Not Married</option>

                    </select>

                    <select name="Dependents_1" required>

                        <option value="">Has 1 Dependent?</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                    <select name="Dependents_2" required>

                        <option value="">Has 2 Dependents?</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                    <select name="Dependents_3+" required>

                        <option value="">Has 3+ Dependents?</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                    <select name="Education_Not Graduate" required>

                        <option value="">Education</option>

                        <option value="0">Graduate</option>

                        <option value="1">Not Graduate</option>

                    </select>

                    <select name="Self_Employed_Yes" required>

                        <option value="">Self Employed?</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                    <select name="Property_Area_Semiurban" required>

                        <option value="">Semiurban Property?</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                    <select name="Property_Area_Urban" required>

                        <option value="">Urban Property?</option>

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                    <!-- LOADING BUTTON -->

                    <button type="submit" id="predictBtn">

                        Predict Loan Status

                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <footer class="footer">

        Developed by Santhosh • AI Loan Prediction System 🚀

    </footer>

    <!-- LOADING SCRIPT -->

    <script>

        const form = document.querySelector("form");

        const btn = document.getElementById("predictBtn");

        form.addEventListener("submit", () => {

            btn.innerHTML = "⏳ Predicting...";

            btn.disabled = true;

        });

    </script>

    <!-- DARK MODE SCRIPT -->

    <script>

        const themeBtn = document.getElementById("themeToggle");

        // LOAD SAVED THEME

        if(localStorage.getItem("theme") === "dark") {

            document.body.classList.add("dark-mode");

            themeBtn.innerHTML = "☀️ Light Mode";
        }

        // TOGGLE THEME

        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark-mode");

            if(document.body.classList.contains("dark-mode")) {

                themeBtn.innerHTML = "☀️ Light Mode";

                localStorage.setItem("theme", "dark");

            } else {

                themeBtn.innerHTML = "🌙 Dark Mode";

                localStorage.setItem("theme", "light");
            }

        });

    </script>

</body>

</html>
